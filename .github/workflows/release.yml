name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: release (${{ matrix.name }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            preset: ci
          - name: windows-x86_64
            os: windows-latest
            preset: ci-msvc
          - name: macos-arm64
            os: macos-latest
            preset: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Install
        run: cmake --install build/ci --config Release --prefix dist
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
          # The SBOM below is uploaded once via the release step; skip the
          # action's own release upload to avoid a duplicate asset.
          upload-release-assets: false
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf binhound-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist .
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath binhound-${{ github.ref_name }}-${{ matrix.name }}.zip
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            binhound-*
            sbom.spdx.json
      - name: Save attestation bundle
        # The bundle lets verifiers (and Scorecard's Signed-Releases check)
        # validate provenance offline, straight from the release assets.
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "binhound-${{ github.ref_name }}-${{ matrix.name }}.sigstore"
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            binhound-*.tar.gz
            binhound-*.zip
            sbom.spdx.json
            *.sigstore
          # Notes are generated once: every matrix job uploads to the same
          # release and each one would otherwise append a duplicate section.
          generate_release_notes: ${{ matrix.name == 'linux-x86_64' }}
